<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curadoria JWT - Login</title>
</head>
<body>
  <h1>Login</h1>
  <form id="form_login">
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Email" required>

    <label for="password">Senha:</label>
    <input type="password" id="password" name="password" placeholder="Senha" required>

    <button type="submit">Entrar</button>
  </form>
  <p id="mensagem"></p>
  <p><a href="listagem.html">Ir para a listagem de usuários</a></p>

  <script>
    const formulario = document.getElementById('form_login');
    const mensagem = document.getElementById('mensagem');

    formulario.addEventListener('submit', async function (event) {
      event.preventDefault();
      mensagem.textContent = 'Entrando...';

      try {
        const dados = Object.fromEntries(new FormData(formulario));
        const resposta = await fetch('http://localhost:3001/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });

        const resultado = await resposta.json();
        if (!resposta.ok) {
          throw new Error(resultado.message || 'Não foi possível fazer login.');
        }

        if (!resultado.accessToken) {
          throw new Error('A API não retornou accessToken.');
        }

        localStorage.setItem('token', resultado.accessToken);
        mensagem.textContent = 'Login realizado! Token salvo no navegador.';
        formulario.reset();
      } catch (erro) {
        mensagem.textContent = erro.message;
        console.error('Erro no login:', erro);
      }
    });
  </script>
</body>
</html>
