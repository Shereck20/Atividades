<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curadoria JWT - Cadastro</title>
</head>
<body>
  <h1>Cadastrar usuário</h1>
  <form id="form_cadastro">
    <label for="name">Nome:</label>
    <input type="text" id="name" name="name" required maxlength="255">

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required maxlength="255">

    <label for="password">Senha:</label>
    <input type="password" id="password" name="password" required minlength="8">

    <button type="submit">Cadastrar</button>
  </form>
  <p id="mensagem"></p>
  <p><a href="login.html">Ir para o login</a></p>

  <script>
    const formulario = document.getElementById('form_cadastro');
    const mensagem = document.getElementById('mensagem');

    formulario.addEventListener('submit', async function (event) {
      event.preventDefault();
      mensagem.textContent = 'Cadastrando...';

      try {
        const dados = Object.fromEntries(new FormData(formulario));
        const resposta = await fetch('http://localhost:3001/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });

        const resultado = await resposta.json();
        if (!resposta.ok) {
          throw new Error(resultado.message || 'Erro ao cadastrar usuário.');
        }

        mensagem.textContent = resultado.message || 'Usuário cadastrado com sucesso!';
        formulario.reset();
      } catch (erro) {
        mensagem.textContent = erro.message;
        console.error('Erro no cadastro:', erro);
      }
    });
  </script>
</body>
</html>
